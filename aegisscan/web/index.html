<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AegisScan — Security Operations Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z' fill='%2322d3ee'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="url(#lg)"/><path d="M9 12l2 2 4-4" stroke="#0b1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div><em>Aegis</em>Scan</div>
    </div>
    <nav id="nav">
      <a href="#/" data-route="/" class="active"><span class="ic">◫</span> Dashboard</a>
      <a href="#/scan" data-route="/scan"><span class="ic">⌖</span> New Scan</a>
      <a href="#/findings" data-route="/findings"><span class="ic">⚑</span> Findings <span class="badge" id="nav-findings">0</span></a>
      <a href="#/mitre" data-route="/mitre"><span class="ic">⌗</span> MITRE ATT&amp;CK</a>
      <a href="#/reports" data-route="/reports"><span class="ic">▤</span> Reports</a>
    </nav>
    <div class="sidebar-foot">
      <div class="env-pill" id="env-pill"><span class="dot"></span> engine online</div>
      <div class="ver" id="ver">AegisScan</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <span class="scan-live" id="scan-live" hidden><span class="dot pulse"></span> scan running…</span>
        <button class="btn primary" onclick="location.hash='#/scan'">⌖ New Scan</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="drawer-backdrop" id="drawer-backdrop" onclick="UI.closeDrawer()"></div>
<aside class="drawer" id="drawer"><div id="drawer-body"></div></aside>

<script src="/static/app.js"></script>
</body>
</html>
